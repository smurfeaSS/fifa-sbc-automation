name = "fc27-sbc-assistant"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# ─── The Access bypass, closed ────────────────────────────────────────────────
# Cloudflare Access protects a *route on your domain*. It does NOT protect the
# free `<worker>.<subdomain>.workers.dev` hostname every Worker gets by default.
# Leaving that enabled means anyone who discovers the URL reaches your club data
# with no login at all.
#
# This disables it. The Worker is then reachable only through the custom domain
# below, which sits behind Access. The JWT check in src/middleware/access.ts is
# the second layer — both matter, because a misconfigured Access policy would
# otherwise be the only thing standing in the way.
workers_dev = false

[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "single-page-application"
# By default Workers Assets serves a matching static file *before* the Worker
# script runs, which means the Access check in src/index.ts never executes for
# the dashboard itself — verified: without this the UI returns 200 to a request
# carrying no Access token at all.
#
# This forces every request through the Worker first, so requireAccess gates the
# UI as well as the API. The Worker then serves assets explicitly via the
# ASSETS binding once the identity checks out.
run_worker_first = true

[vars]
APP_NAME = "fc27-sbc-assistant"
APP_ENV = "development"
LOG_LEVEL = "info"
# The single address allowed in. Enforced in the Worker as well as in the Access
# policy, so a policy edit alone cannot open this up.
ALLOWED_EMAIL = "mariosxen7@icloud.com"
# Your Zero Trust team domain, e.g. "yourteam" for yourteam.cloudflareaccess.com
ACCESS_TEAM_DOMAIN = "REPLACE_WITH_YOUR_TEAM_NAME"
# The Access application's AUD tag (Zero Trust > Access > Applications > Overview)
ACCESS_AUD = "REPLACE_WITH_YOUR_ACCESS_AUD_TAG"

[[d1_databases]]
binding = "DB"
database_name = "fc27-sbc-assistant-club"
database_id = "REPLACE_WITH_CLUB_DB_ID"          # run: npm run db:create
migrations_dir = "migrations"

# Caches the Access public keys (JWKS). Without this every request would fetch
# them, which burns a subrequest and adds latency to every page load.
[[kv_namespaces]]
# Holds the Cloudflare Access signing keys (JWKS). Named for the job rather
# than "CACHE", so what lives in it is obvious from the binding alone.
binding = "ACCESS_KEYS"
id = "REPLACE_WITH_ACCESS_KEYS_ID"               # run: npm run kv:create
preview_id = "REPLACE_WITH_ACCESS_KEYS_PREVIEW_ID"

# ─── CPU allowance (Workers Paid) ────────────────────────────────────────────
# The free plan caps CPU at 10ms per request, which is what originally forced
# the club import and SBC solving to be split across many small requests. On the
# paid plan the default is 30s; this states it rather than relying on the
# default, so the budget the solver is tuned against is visible in one place.
#
# Wall-clock time waiting on D1, KV or fetch does NOT count against this — only
# actual JS execution does.
[limits]
cpu_ms = 30000

[observability]
enabled = true
head_sampling_rate = 1

[dev]
port = 8787
local_protocol = "http"

# ─── PRODUCTION ───────────────────────────────────────────────────────────────
[env.production]
name = "fc27-sbc-assistant-prod"
workers_dev = false

[env.production.assets]
directory = "./public"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "single-page-application"
# Same reason as above — without this the production UI is served without ever
# reaching the Access check.
run_worker_first = true

# Access protects this hostname. Set up the Access application against exactly
# this route — see edge/ACCESS-SETUP.md.
routes = [
  { pattern = "sbc.REPLACE_WITH_YOUR_DOMAIN", custom_domain = true }
]

[env.production.vars]
APP_ENV = "production"
LOG_LEVEL = "warn"
ALLOWED_EMAIL = "mariosxen7@icloud.com"
ACCESS_TEAM_DOMAIN = "REPLACE_WITH_YOUR_TEAM_NAME"
ACCESS_AUD = "REPLACE_WITH_YOUR_ACCESS_AUD_TAG"

[[env.production.d1_databases]]
binding = "DB"
database_name = "fc27-sbc-assistant-club"
database_id = "REPLACE_WITH_CLUB_DB_ID"
migrations_dir = "migrations"

[[env.production.kv_namespaces]]
binding = "ACCESS_KEYS"
id = "REPLACE_WITH_ACCESS_KEYS_ID"

[env.production.limits]
cpu_ms = 30000

[env.production.observability]
enabled = true
head_sampling_rate = 1
